# Тестовый деплой static /out на GitHub Pages.
# Запуск только вручную (workflow_dispatch). Автодеплой с push отключён.
#
# Рекомендуемая ветка для теста: migration/static-no-vercel
# Custom domain / DNS / Vercel / Cloudflare не трогаем этим workflow.

name: Deploy GitHub Pages (test)

on:
  workflow_dispatch:
    inputs:
      pages_base_path:
        description: 'basePath для project site (для теста оставьте /tvernefteregion; для apex-домена — пусто)'
        required: false
        default: '/tvernefteregion'
        type: string
      site_url:
        description: 'NEXT_PUBLIC_SITE_URL для сборки (тестовый github.io URL)'
        required: false
        default: 'https://si5378127-ship-it.github.io/tvernefteregion'
        type: string
      remove_cname:
        description: 'Удалить CNAME из артефакта (нужно, пока custom domain не подключаем)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
          PAGES_BASE_PATH: ${{ inputs.pages_base_path }}

      - name: Remove CNAME for test deploy
        if: ${{ inputs.remove_cname }}
        run: |
          if [ -f out/CNAME ]; then
            rm -f out/CNAME
            echo "Removed out/CNAME (custom domain not used for this test)."
          else
            echo "No out/CNAME present."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
