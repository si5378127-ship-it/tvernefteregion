# Manual GitHub Pages test deploy from main.
# Builds code from migration/static-no-vercel only - does not merge that branch.
# Auto-deploy on push is disabled. DNS / Cloudflare / Vercel / custom domain unchanged.

name: Deploy GitHub Pages (test)

on:
  workflow_dispatch:
    inputs:
      pages_base_path:
        description: 'basePath for project site (keep /tvernefteregion for github.io test)'
        required: false
        default: '/tvernefteregion'
        type: string
      site_url:
        description: 'NEXT_PUBLIC_SITE_URL for build (test github.io URL)'
        required: false
        default: 'https://si5378127-ship-it.github.io/tvernefteregion'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration/static-no-vercel
        uses: actions/checkout@v4
        with:
          ref: migration/static-no-vercel

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://si5378127-ship-it.github.io/tvernefteregion' }}
          PAGES_BASE_PATH: ${{ inputs.pages_base_path || '/tvernefteregion' }}

      - name: Remove out/CNAME if present
        run: |
          if [ -f out/CNAME ]; then
            rm -f out/CNAME
            echo "Removed out/CNAME."
          else
            echo "No out/CNAME present."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4